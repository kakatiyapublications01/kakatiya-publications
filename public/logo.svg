<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <linearGradient id="goldTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Kakatiya Arch / Crest Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield Frame -->
    <path d="M 32 4 L 56 16 V 44 Q 56 58 32 66 Q 8 58 8 44 V 16 Z" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="2.5" 
          filter="url(#goldGlow)"/>
          
    <!-- Inner Arch Pattern (Kakatiya Toranam Motif) -->
    <path d="M 18 48 V 32 Q 18 20 32 20 Q 46 20 46 32 V 48" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="2" />
          
    <!-- Royal Diamond Star Crest -->
    <polygon points="32,10 35,17 42,17 36,21 38,28 32,23 26,28 28,21 22,17 29,17" 
             fill="url(#goldGradient)" />
             
    <!-- Center Dot Pillar -->
    <circle cx="32" cy="38" r="3" fill="url(#goldGradient)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(80, 20)">
    <!-- Main Title: KAKATIYA -->
    <text x="0" y="28" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="4" 
          fill="url(#goldTextGradient)">
      KAKATIYA
    </text>

    <!-- Subtitle: PUBLICATIONS -->
    <text x="2" y="46" 
          font-family="'Inter', sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="7" 
          fill="#A1A1AA">
      PUBLICATIONS
    </text>
  </g>
</svg>
