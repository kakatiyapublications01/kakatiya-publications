<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6D31" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#emblemGold)" stroke-width="2" opacity="0.4" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#emblemGold)" stroke-width="1.5" />

